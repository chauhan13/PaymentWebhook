spring.application.name=payment-webhook-debugger
server.port=8080

spring.datasource.url=jdbc:h2:file:./payment-webhook-db;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.generate_statistics=false

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

app.seed.enabled=true
app.seed.count=100
app.seed.full=${APP_SEED_FULL:false}
app.processing.artificial-work-units=2

logging.level.root=INFO
logging.level.com.mercor.paymentwebhook=INFO
logging.pattern.console=%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%thread] [corr:%X{correlationId:-}] %logger{36} - %msg%n
